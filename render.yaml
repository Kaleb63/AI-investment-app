services:
  - type: web
    name: ai-investment-api
    runtime: docker
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-investment-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PLAID_ENCRYPTION_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: TRUSTED_HOSTS
        sync: false

databases:
  - name: ai-investment-db
    databaseName: ai_investment
    user: ai_investment
